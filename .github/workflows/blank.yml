name: Toggle README trailing space

on:
  schedule:
    # 每天 UTC 00:00 运行（对应北京时间 08:00）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  toggle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Toggle trailing space in README.md
        run: |
          FILE="README.md"

          if [ ! -f "$FILE" ]; then
            echo "README.md 不存在，退出"
            exit 1
          fi

          # 先去掉文件末尾所有空白字符（空格、换行等）
          # 保证状态干净
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$FILE"
          sed -i 's/[[:space:]]*$//' "$FILE"

          # 根据一年中的第几天决定加还是不加空格（奇偶交替）
          DAY=$(date +%j)
          if [ $((10#$DAY % 2)) -eq 1 ]; then
            # 奇数天：末尾加一个空格
            echo -n " " >> "$FILE"
            echo "今天是奇数天 → 已添加末尾空格"
          else
            # 偶数天：保持无空格
            echo "今天是偶数天 → 已移除末尾空格"
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: toggle trailing space in README ($(date +%Y-%m-%d))"
            git push
            echo "已提交并推送"
          fi
