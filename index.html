<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="google-site-verification" content="H1lTb7bdJuzbW5T9vH3hfQ9QZb9zYrbDcTfapYIgQpU">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="五元机场：稳定、便捷的一站式订阅服务。">
  <meta name="theme-color" content="#0b1220">
  <title>五元机场｜稳定、便捷的订阅服务</title>
  <style>
    :root { --bg:#0b1220; --panel:rgba(16,35,67,.72); --text:#eef5ff; --muted:#aebdd3; --line:rgba(194,216,255,.15); --brand:#67e8f9; --brand-2:#a78bfa; --accent:#86efac; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); line-height:1.65; }
    a { color:inherit; text-decoration:none; }
    .hero { position:relative; overflow:hidden; min-height:700px; background:radial-gradient(circle at 17% 13%,rgba(86,214,255,.22),transparent 34%),radial-gradient(circle at 83% 18%,rgba(131,117,255,.22),transparent 30%),linear-gradient(135deg,#061125 0%,#172554 55%,#312e81 100%); }
    .hero::before { content:""; position:absolute; inset:0; opacity:.28; background-image:linear-gradient(rgba(176,209,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(176,209,255,.12) 1px,transparent 1px); background-size:48px 48px; mask-image:linear-gradient(to bottom,black,transparent 88%); }
    .wrap { width:min(1120px,calc(100% - 40px)); margin:0 auto; position:relative; }
    nav { height:84px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { font-size:20px; font-weight:800; letter-spacing:.08em; }
    .brand i { display:inline-grid; place-items:center; width:30px; height:30px; margin-right:8px; border-radius:10px; color:#0b1220; font-style:normal; background:linear-gradient(135deg,var(--brand),#cffafe); }
    .nav-link { display:inline-flex; align-items:center; justify-content:center; min-height:38px; padding:0 14px; border:1px solid var(--line); border-radius:10px; color:var(--muted); font-size:14px; font-weight:700; transition:transform .2s,background .2s; }
    .nav-link:hover { transform:translateY(-1px); background:rgba(255,255,255,.055); }
    .hero-content { display:grid; grid-template-columns:1.12fr .88fr; gap:62px; align-items:center; padding:90px 0 126px; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border:1px solid rgba(86,214,255,.32); border-radius:99px; color:#cffafe; font-size:13px; background:rgba(86,214,255,.08); }
    .dot { width:7px; height:7px; border-radius:50%; background:#86efac; box-shadow:0 0 0 5px rgba(117,240,191,.13); }
    h1 { margin:20px 0 18px; font-size:clamp(40px,6vw,68px); letter-spacing:-.055em; line-height:1.13; }
    h1 span { color:var(--brand); }
    .lead { max-width:610px; margin:0; color:var(--muted); font-size:18px; }
    .actions { display:flex; flex-wrap:wrap; gap:13px; margin-top:32px; }
    .button { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 21px; border:1px solid var(--line); border-radius:12px; font-weight:700; transition:transform .2s,background .2s; }
    .button:hover { transform:translateY(-2px); }
    .button.primary { color:#04101f; border-color:transparent; background:linear-gradient(135deg,#67e8f9,#c4b5fd); box-shadow:0 12px 35px rgba(86,214,255,.2); }
    .button.secondary { color:#dcecff; background:rgba(255,255,255,.055); }
    .note { margin-top:17px; color:#8090aa; font-size:12px; }
    .terminal { position:relative; border:1px solid rgba(170,204,255,.24); border-radius:19px; overflow:hidden; background:linear-gradient(145deg,rgba(25,50,90,.72),rgba(10,22,46,.78)); box-shadow:0 28px 70px rgba(0,0,0,.26); }
    .terminal-head { display:flex; align-items:center; gap:7px; height:48px; padding:0 17px; border-bottom:1px solid var(--line); color:#99acce; font-size:12px; }
